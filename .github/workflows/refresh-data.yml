name: Refresh validated auction data

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/refresh-data.yml
      - R/**
      - _targets.R
      - data-raw/source_registry.csv
      - tests/**

permissions:
  contents: write

concurrency:
  group: refresh-auction-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::targets
            any::tidyverse
            any::rvest
            any::xml2
            any::janitor
            any::httr2
            any::stringi
            any::here
            any::digest
            any::fixest
            any::testthat
            any::readxl
      - name: Test parsers
        run: Rscript tests/testthat.R
      - name: Build validated data
        run: Rscript -e 'targets::tar_make()'
      - name: Commit generated analytical table
        run: |
          if git diff --quiet -- data/processed/auction_lots.csv data/processed/source_audit.csv data/processed/commodity_prices.csv; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/auction_lots.csv data/processed/source_audit.csv data/processed/commodity_prices.csv
          git commit -m "Refresh validated auction and commodity data"
          git push
